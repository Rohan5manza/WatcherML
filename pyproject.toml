[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watcherml"
version = "0.1.0"
description = "A local-first experiment flight recorder for notebook-first ML: captures code, environment, GPU/system state, and failure context needed to reproduce and debug every run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
notebook = ["ipython>=8.0"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
watcher = "watcherml.cli:main" #shorter compatibility alias to main watcherml executable
watcherml = "watcherml.cli:main" #primary CLI name

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watcherml = ["webstatic/*"]